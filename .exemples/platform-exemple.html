<script>
(() => {
const $ = id => document.getElementById(id);
const wb = s => esc(s).replace(/([.\-/])/g, "$1<wbr>").replace(/([a-z0-9])([A-Z])/g, "$1<wbr>$2");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- data ---------- */
const SEC_ORDER = ["cor","primitivo","tipografia","raio","borda","spacing","opacidade"];
const META = {
  cor:{t:"Cor",d:"Papéis semânticos de cor. A tela legada troca o token do 2.0 pelo papel do 3.0 que assume o lugar, com o nome do 3.0. Véus de opacidade e cores sem papel no 3.0 continuam com o token do 2.0 até uma decisão."},
  primitivo:{t:"Primitivos de cor",d:"No 3.0 ninguém aplica primitivo (decisão 0053). Onde a tela legada usa um primitivo direto, o papel do 3.0 é escolhido pelo uso (fundo, texto ou borda) na migração de cada tela; até lá, a tela continua com o token do 2.0. A rampa do 3.0 aparece só como referência de valor."},
  tipografia:{t:"Tipografia",d:"Cada estilo do 2.0 é trocado por um estilo do 3.0, com a variante de peso indicada (normal ou de ênfase). A família não se troca sozinha: chega pelo estilo (decisão 0053), com Söhne provisória. Vários estilos mudam também de peso, altura de linha ou tamanho."},
  raio:{t:"Raio",d:"Escala de raios e variantes por canto. A tela troca pelo raio semântico do 3.0 (<code>shape.xs</code> a <code>shape.xl</code>); valores sem degrau no 3.0 vão para o mais próximo (empate sobe). O 3.0 não tem raio zero."},
  borda:{t:"Borda",d:"Espessuras de traço. O 3.0 vai até 2 px e não tem token de espessura zero."},
  spacing:{t:"Espaçamento",d:"Escala de espaçamento. A tela troca pelo espaço semântico do 3.0 (<code>space.none</code> a <code>space.5xl</code>), e a troca é de escala, não de regra de layout. Valores que não existem na escala do 3.0 continuam com o token do 2.0 até a migração revisar o uso."},
  opacidade:{t:"Opacidade",d:"O 3.0 não tem escala de opacidade solta, e cor com opacidade é primitivo, que não vai para a tela (decisão 0053). A tela continua com o token do 2.0. Para véu, use um papel: <code>bg.backdrop</code> atrás de modal e sheet, <code>state.*</code> sobre o que está pressionado ou em hover."}
};
const COLOR_SECS = new Set(["cor","primitivo"]);
const secs = SEC_ORDER.map(id => { const s = DATA.secs.find(x => x.id === id); return {id, t:META[id].t, d:META[id].d, rows:(s ? s.rows : []).map(r => Object.assign({sec:id}, r))}; });
const all = secs.flatMap(s => s.rows);
const byId = Object.fromEntries(all.map(r => [r.id, r]));
const decOf = {}; DATA.decisoes.forEach(d => d.linhas.forEach(id => (decOf[id] ??= []).push(d)));
const GROUPLABEL = {"":"Escala","variante":"Variantes por canto","legado iOS":"Nomes legados do iOS","família":"Família (chega pelo estilo de texto)","família (primitivo)":"Família (chega pelo estilo de texto)","neutros":"neutros"};
const CONF = ["baixa","média","alta"];
const ACAO = {
  "qa-visual":{t:"Precisa de QA visual"},
  "decisao-design":{t:"Precisa de decisão de Design"},
  "confirmar-engenharia":{t:"Confirmar com a Engenharia"},
  "escolha-por-uso":{t:"Escolha por uso na migração da tela"},
  "nada":{t:"Nada a fazer"}
};
const STATUS = {pendente:"Pendente", revisado:"Revisado (Design)", aplicado:"Aplicado no 2.1 (Engenharia)", stale:"Revisar de novo"};
const STATUS_SHORT = {pendente:"Pendente", revisado:"Revisado", aplicado:"Aplicado", stale:"Revisar de novo"};
const SAVED_STATUS = new Set(["pendente","revisado","aplicado"]);
const DATA_VER = DATA.meta.version;
const FOUNDATION_VER = DATA.meta.foundation || "v0.1";
/* A impressão digital mantém o formato antigo ({novo, v30}); com mais de um destino, os nomes vêm juntos com " + ",
   como na 0.4.0, para não derrubar validações só pela mudança de formato. A variante de peso é conferida à parte. */
const novoKey = r => (Array.isArray(r.novos) && r.novos.length > 1 ? r.novos.join(" + ") : r.novo) ?? null;
/* ---------- Facelift (2.1): o que a tela legada aplica. novo/estado/v30 continuam sendo a verdade do Redesign. ---------- */
const F = r => (r && r.facelift) || null;
const FCAM = {semantico:"Semântico", tom:"Tom", ajuste:"Ajuste", composicao:"Composição", "2.0":"Fica no 2.0", aposentar:"Aposentar"};
const FMOT = {estrutura:"estrutura: não pinta a tela", marca:"marca: decisão da Direção Criativa", "sem-equivalente":"sem equivalente no 3.0", "sem-uso":"sem uso no código", "uso-incerto":"uso incerto: o nome pode chegar do servidor"};
const fApplied = r => F(r) ? !["2.0", "aposentar", "composicao"].includes(F(r).camada) : !!r.troca;
const fVal = r => (F(r) ? (fApplied(r) ? F(r).valor : null) : r.v30) || null;
const fToks = r => F(r) ? (F(r).tokens || []) : (r.novos && r.novos.length ? r.novos : (r.novo ? [r.novo] : []));
const normV = v => Array.isArray(v) ? JSON.stringify(v) : String(v ?? "").replace(/\s*px$/, "").trim();
const sameV = (a, b) => normV(a) === normV(b);
const fMuda = r => { const v = fVal(r); return !!(fApplied(r) && v && v.l != null && !sameV(v.l, r.v20.l)); };
const fEscuro = r => { const v = fVal(r); return !!(fApplied(r) && v && v.d && r.v20.d && !sameV(v.d, r.v20.d)); };
const isVeil = c => Array.isArray(c) && c[1] < 1 && /^#(000000|ffffff)$/i.test(c[0]);
const veilFlip = (a, b) => isVeil(a) && isVeil(b) && a[0].toLowerCase() !== b[0].toLowerCase();
const fFlip = r => { const v = fVal(r); return !!(v && v.d && r.v20.d && veilFlip(r.v20.d, v.d)); };
const fpOf = r => F(r) ? JSON.stringify({novo:(F(r).tokens && F(r).tokens.length ? F(r).tokens.join(" + ") : null), v30:fApplied(r) ? (F(r).valor ?? null) : null}) : JSON.stringify({novo:novoKey(r), v30:r.v30 ?? null});
/* Decisão 0051: a 0.3.0 troca o modelo (token do 3.0 assume o lugar). Marcas anteriores não caem por causa disso. */
const MODEL_BASE = "0.3.0";
const preModel = ver => !ver || verNewer(MODEL_BASE, ver);
const fpMap = Object.fromEntries(all.map(r => [r.id, fpOf(r)]));
const parseFp = s => { try { return JSON.parse(s); } catch(e){ return null; } };
const verNewer = (a, b) => String(a).localeCompare(String(b), undefined, {numeric:true}) > 0;

/* ---------- validation store ---------- */
const V = {map:{}, mode:"loading", db:null, user:null, uid:null, canWrite:true, names:{}, pendingRender:false, vers:null, migrated:false};
const LS_KEY = "lumen-eq-revisao-v1";
const vget = id => V.map[id] || {status:"pendente", note:""};
/* Status efetivo: uma marca feita com outro token do 3.0 (ou outro valor dele) vira "stale" (Revisar de novo). */
/* Motivo da mudança desde a validação: "valor" (o visual mudou), "nome" (só o token do 3.0 mudou) ou "variante" (peso). */
function staleReason(id){
  const v = V.map[id]; if (!v || !v.status || v.status === "pendente" || preModel(v.ver)) return null;
  const r = byId[id];
  if (v.val !== undefined && v.val !== fpMap[id]) {
    const old = parseFp(v.val);
    const cur = parseFp(fpMap[id]) || {};
    return old && JSON.stringify(old.v30 ?? null) === JSON.stringify(cur.v30 ?? null) ? "nome" : "valor";
  }
  if (v.variante && r.variante && v.variante !== r.variante) return "variante";
  return null;
}
/* Regra aprovada: troca só de nome mantém a revisão do Design (com aviso) e derruba o Aplicado; valor ou variante derrubam os dois. */
function vstat(id){
  const v = V.map[id];
  if (!v || !v.status || v.status === "pendente") return "pendente";
  const why = staleReason(id);
  if (!why) return v.status;
  if (why === "nome" && v.status === "revisado") return "revisado";
  return "stale";
}
const nameNotice = id => { const v = V.map[id]; return v && v.status === "revisado" && staleReason(id) === "nome"; };
const isRev = id => { const s = vstat(id); return s === "revisado" || s === "aplicado"; };
const isApl = id => vstat(id) === "aplicado";
const isStale = id => vstat(id) === "stale";
function pct(rows, f){ return rows.length ? Math.round(100 * rows.filter(r => f(r.id)).length / rows.length) : 0; }

async function initStore(){
  let db = null;
  if (window.claude && typeof window.claude.use === "function") {
    try { db = await window.claude.use("db"); } catch(e){ db = null; }
  }
  if (db) {
    V.db = db; V.mode = "db";
    try { V.user = await window.claude.use("user"); } catch(e){ V.user = null; }
    if (V.user) {
      try { V.uid = await V.user.id(); } catch(e){}
      try { const c = await V.user.can("data.write"); if (c === false) V.canWrite = false; } catch(e){}
      try { V.canEdit = (await V.user.canEdit()) === true; } catch(e){ V.canEdit = false; }
    }
    db.collection("revisao").limit(1000).onSnapshot(qs => {
      const m = {}; qs.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); });
      V.map = m; resolveNames(); migrateLegacy(); refreshAfterData();
    }, err => { toast("A validação compartilhada ficou indisponível nesta visita."); });
    db.collection("decisoes").limit(100).onSnapshot(qs => {
      const m = {}; qs.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); });
      V.dec = m; resolveNames(); refreshAfterData();
    }, () => {});
    syncVersions();
    refreshAfterData();
    return;
  }
  if (window.storage && typeof window.storage.get === "function") {
    try { const r = await window.storage.get(LS_KEY); if (r && r.value) V.map = JSON.parse(r.value); } catch(e){}
    V.mode = "storage"; await loadDecLocal(); await syncVersions(); migrateLegacy(); refreshAfterData(); return;
  }
  try { const raw = localStorage.getItem(LS_KEY); if (raw) V.map = JSON.parse(raw) || {}; } catch(e){ V.map = {}; }
  V.mode = "local"; await loadDecLocal(); await syncVersions(); migrateLegacy(); refreshAfterData();
}
async function persistLocal(){
  const s = JSON.stringify(V.map);
  if (V.mode === "storage") { try { await window.storage.set(LS_KEY, s); } catch(e){ toast("Não foi possível salvar."); } }
  else { try { localStorage.setItem(LS_KEY, s); } catch(e){ toast("Não foi possível salvar neste navegador."); } }
}
async function vset(id, patch){
  if (V.mode === "loading") return;
  const cur = vget(id);
  let next;
  if (patch.status === undefined) {
    /* só a nota: mantém quem marcou, quando e contra qual valor */
    next = {...cur, status:cur.status || "pendente", note:patch.note ?? cur.note ?? ""};
    if (!next.by) { next.by = V.uid || "local"; next.at = new Date().toISOString(); }

const CAT30_COLOR = {"Cor":"#2f6fec","Tom":"#7c5cff","Dimensão":"#1f9d8b","Tipografia":"#e0782f","Movimento":"#c2417a","Layout":"#5f8f2f"};

function buildTree(kind, bridge){
  const nodes = new Map(), links = [], seen = new Set();

  const link = (s, t, rel) => { const k = s + ">" + t + ">" + rel; if (seen.has(k) || s === t) return; seen.add(k); links.push({source:s, target:t, rel}); };

    parts.forEach((p, i) => {
      path = path ? path + "." + p : p; const leaf = i === parts.length - 1;
      const asTok = "30:" + path;

      const id = leaf ? asTok : "ns:" + (cat ? cat + "|" : "") + path;
      if (!nodes.has(id)) {
        add(id, leaf ? Object.assign({label:tok, short:p, type:"tok30", rows:[], grupo:meta.grupo, camada:meta.camada, valor:meta.valor}, extra || {}) : {label:path, short:p, type:"ns", grupo:cat});

      const cid = "cat:" + s.id; add(cid, {label:s.t, type:"cat", cat:s.id}); link("root:20", cid, "estrutura"); counts.estrutura++;
      s.rows.forEach(r => {

        if (!nodes.has(gid)) { add(gid, {label:GROUPLABEL[gname] ?? gname, type:"grp", cat:s.id}); link(cid, gid, "estrutura"); counts.estrutura++; }
        add(r.id, {label:r.n, type:"tok", cat:s.id, row:r, camada:s.id === "primitivo" ? "primitivo" : "semantico"}); link(gid, r.id, "estrutura"); counts.estrutura++;

      if (byId[id]) { add(id, {label:byId[id].n, type:"tok", cat:byId[id].sec, row:byId[id]}); return id; }
      const r = all.find(x => x.n === id); if (r) { add(r.id, {label:r.n, type:"tok", cat:r.sec, row:r}); return r.id; }

function viewRevisar(){
  const ff = curFilter().f;
  const groups = ["qa-visual","decisao-design","escolha-por-uso","confirmar-engenharia","nada"].map(a => ({a, rows:all.filter(r => r.acao === a && ff(r))}));
  const bySec = rows => secs.map(s => [s, rows.filter(r => r.sec === s.id)]).filter(x => x[1].length);
  const blocks = groups.map(({a, rows}) => {
    if (!rows.length) return "";
    const done = rows.filter(r => isRev(r.id)).length;
    let why = "", guide = "";
    if (a === "qa-visual") {
      why = "A regra já está definida, mas só vendo na tela dá para saber se a mudança ficou boa.";
      guide = `<ul class="guide">${bySec(rows).map(([s, rs]) => `<li><b>${esc(s.t)}</b><span class="c">${pl(rs.length,"linha","linhas")}</span><br>${esc(QA_LOOK[s.id] || "")}</li>`).join("")}</ul>`;
    } else if (a === "decisao-design") {
      why = "O 3.0 não tem um token que assuma o lugar de forma direta, então alguém precisa escolher o caminho antes da troca.";
      const covered = new Set(); DATA.decisoes.forEach(d => d.linhas.forEach(id => covered.add(id)));
      const decs = DATA.decisoes.map(d => [d, rows.filter(r => d.linhas.includes(r.id))]).filter(x => x[1].length);
      const loose = rows.filter(r => !covered.has(r.id));
      guide = `<ul class="guide">${decs.map(([d, rs]) => `<li><b>${esc(d.titulo)}</b><span class="c">${pl(rs.length,"linha","linhas")}</span><br>Decide: ${esc(d.quem)}. Material: ${esc(d.atividade)}. <button class="link" type="button" data-godec="${esc(d.id)}">Ver as opções</button></li>`).join("")}${loose.length ? `<li><b>Sem cartão de decisão</b><span class="c">${pl(loose.length,"linha","linhas")}</span><br>Leve para a próxima revisão de Design com a regra de cada linha aberta.</li>` : ""}</ul>`;
    } else if (a === "escolha-por-uso") {
      why = "No 3.0 ninguém aplica primitivo (decisão 0053): onde a tela legada usa um primitivo direto, o papel do 3.0 sai do uso em cada tela, na migração.";
      const nc = rows.filter(r => r.candidatos && r.candidatos.length).length;
      guide = `<ul class="guide"><li><b>Quem escolhe</b><br>O Design de cada squad, na migração da tela, olhando o uso: fundo → <code>bg.*</code>, texto → <code>content.*</code>, borda → <code>border.*</code>.</li><li><b>O que ajuda</b><br>${pl(nc, "linha tem", "linhas têm")} candidatos de mesmo valor do degrau de referência. É uma sugestão por valor, não pelo uso: confira na tela. Revisar aqui significa conferir a referência; a escolha final é por tela.</li></ul>`;
    } else if (a === "confirmar-engenharia") {
      why = "O 2.0 já diverge entre Android e iOS nesses estilos, e só o código diz qual valor vale.";
      guide = `<ul class="guide"><li><b>O que perguntar</b><br>No 2.0, Android e iOS usam pesos ou faces diferentes para o mesmo estilo. Qual estilo do 3.0, e com qual peso, a tela deve consumir? A regra de cada linha diz onde está a divergência.</li></ul>`;
    } else {
      why = "A troca não muda o visual de forma relevante, ou a tela continua com o token do 2.0. Basta conferir que nada quebrou.";
    }
    const table = tableHTML(crossRows(rows));
    return `<section class="block"><h2>${ACAO[a].t} <span class="gc" style="font-weight:400;color:var(--mu)">${pl(rows.length,"linha","linhas")} · ${done} ${done === 1 ? "revisada" : "revisadas"}</span></h2>
      <p class="why">${why}</p>${guide}
      ${a === "nada" ? `<details class="fold"><summary>Mostrar as ${rows.length} linhas</summary>${table}</details>` : table}</section>`;
  }).join("");
  return `<h1>Revisar primeiro</h1><p class="desc">O que cada linha precisa antes de entrar no 2.1, agrupado pela atividade necessária. Marque a validação no detalhe de cada linha.</p>${blocks}`;
}

function stepOf(r){ const s = r.n.slice(r.g.length); return s || r.n; }
function viewRamps(s){
  const order = []; const by = {};
  s.rows.forEach(r => { if (!by[r.g]) { by[r.g] = []; order.push(r.g); } by[r.g].push(r); });
  const ramps = order.map(g => {
    const rs = by[g];
    const to = DATA.meta.rampMapping[g] ?? null;
    const ref = r => to ? node30[`color.solid.${to}.on-light.${stepOf(r)}`] : null;
    const ncand = rs.filter(r => r.candidatos && r.candidatos.length).length;
    const decs = [...new Set(rs.flatMap(r => (decOf[r.id] || []).map(d => d.id)))].map(id => decById[id]);
    const head = to
      ? `<span>referência de valor: rampa <b>${esc(to)}</b> do 3.0</span><span class="mu">${rs[0].acao === "escolha-por-uso" ? "escolha por uso" : esc(ACAO[rs[0].acao]?.t || "")} · ${pl(ncand, "degrau com candidato", "degraus com candidato")}</span>`
      : `<span>${rs[0].estado === "sem-par" ? "sem par no 3.0" : "sem rampa no 3.0"}</span>${decs.length ? `<span class="mu">${decs.map(d => `<button class="link" type="button" data-godec="${esc(d.id)}">${esc(d.titulo)}</button>`).join(", ")}</span>` : ""}`;
    const cell = (title, v) => v ? `<span class="cell" title="${esc(title)}"><i style="background:${v[0]};opacity:${v[1]}"></i></span>` : `<span class="cell empty" title="${esc(title)}"></span>`;
    const hoje = `<div class="strip" style="--n:${rs.length}"><span class="lab">Hoje</span>${rs.map(r => cell(`${r.n} ${hexText(r.v20.l)}`, r.v20.l)).join("")}</div>`;
    const refS = to ? `<div class="strip ref" style="--n:${rs.length}"><span class="lab">Referência 3.0</span>${rs.map(r => { const n = ref(r); return cell(n ? `${n.id} ${hexText(n.valor.l)}` : `sem degrau ${stepOf(r)} na rampa ${to}`, n && n.valor ? n.valor.l : null); }).join("")}</div>` : "";
    const steps = `<div class="strip steps" style="--n:${rs.length}"><span></span>${rs.map(r => `<span class="s${r.candidatos && r.candidatos.length ? " ch" : ""}" title="${r.candidatos && r.candidatos.length ? esc(r.candidatos.map(c => c.token).join(", ")) : "sem candidato de mesmo valor"}">${esc(stepOf(r))}</span>`).join("")}</div>`;
    return `<div class="ramp"><div class="ramp-h"><h3>${esc(g)}</h3>${head}</div>${hoje}${refS}${steps}${to ? "" : `<p class="why-m">${esc(rs[0].rule)}</p>`}</div>`;
  }).join("");
  return `<h2>Rampas</h2><p class="desc" style="margin-bottom:18px">Faixa de cima: como está hoje. Faixa de baixo: o degrau equivalente na rampa do 3.0, só como referência de valor, porque a tela não aplica primitivo do 3.0. Degraus em azul têm papéis do 3.0 com o mesmo valor (candidatos); passe o mouse para ver quais.</p>${ramps}`;
}

  const filename = `lumen-2.0-3.0-revisao_dados-v${DATA_VER}_${stamp}.json`;
  const markExport = () => { try { localStorage.setItem("lumen-eq-ultimo-export", JSON.stringify({at:now.toISOString(), versao:DATA_VER, linhas:rows.length, decididas:resumo.decisoes.decididas})); } catch(e){} if (state.view === "fluxo") renderView(false); };
  const okMsg = `Revisão exportada: dados ${DATA_VER}, ${resumo.decisoes.decididas} de ${resumo.decisoes.total} decisões tomadas.`;
  let dl = null;
  try { if (window.claude && window.claude.use) dl = await window.claude.use("downloads"); } catch(e){ dl = null; }
  if (dl) { try { const res = await dl.save({filename, data}); if (res && res.status === "saved") { toast(okMsg); markExport(); } } catch(e){ if (e && e.code !== "cancelled") toast("A exportação não foi concluída."); } return; }
  if (isFileProto()) {
    try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], {type:"application/json"})); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast(okMsg); markExport(); } catch(e){ toast("A exportação não está disponível aqui."); }
    return;
  }
  /* Na página publicada o link de download é inerte. Sem o recurso de download, o JSON vai para a área de transferência. */
  try { await navigator.clipboard.writeText(data); toast("Este acesso não salva arquivos. O JSON da revisão foi copiado: cole num arquivo .json."); markExport(); }
  catch(e){ toast("Este acesso não permite exportar aqui. Peça a um editor da página."); }
}
async function importRev(file){
  let parsed;
  try { parsed = JSON.parse(await file.text()); } catch(e){ toast("O arquivo não é um JSON válido."); return; }
  const list = Array.isArray(parsed) ? parsed : parsed && Array.isArray(parsed.revisao) ? parsed.revisao : null;
  const dlist = parsed && Array.isArray(parsed.decisoes) ? parsed.decisoes : [];
  if (!list && !dlist.length) { toast("O arquivo não tem a lista “revisao”."); return; }
  let nd = 0;
  for (const e of dlist) {
    const d = e && decById[e.id]; if (!d || e.status === "pendente" || e.opcao === null) continue;
    let oi = Number.isInteger(e.opcao) && d.opcoes[e.opcao] ? e.opcao : d.opcoes.findIndex(o => o.nome === e.nome);
    if (oi < 0) continue;
    const c = dget(d.id); if (c && c.opcao === oi && (c.note || "") === (e.nota || "")) continue;
    const ok = await dsetRec(d.id, {opcao:oi, nome:d.opcoes[oi].nome, by:V.uid || "local", at:e.data || new Date().toISOString(), note:e.nota || "", ver:DATA_VER});
    if (!ok) break; nd++;
  }
  let n = 0, skip = 0;
  for (const e of (list || [])) {
    if (!e || !byId[e.id] || !SAVED_STATUS.has(e.status)) { skip++; continue; }
    const cur = vget(e.id);
    /* o valor validado no arquivo decide se a marca ainda vale; sem valor, assume os dados atuais */
    /* arquivos do modelo antigo (0.2.0, valor no formato v21) recebem a mesma migração da decisão 0051 */
    const oldModel = preModel(e.versao) || (e.valor && typeof e.valor === "object" && !("novo" in e.valor));
    const val = oldModel || !e.valor ? fpMap[e.id] : JSON.stringify({novo:e.valor.novo ?? null, v30:e.valor.v30 ?? null});
    const ver = oldModel ? DATA_VER : (e.versao || DATA_VER);
    if (cur.status === e.status && (cur.note || "") === (e.nota || "") && (cur.val ?? fpMap[e.id]) === val) continue;
    const ok = await vset(e.id, {status:e.status, note:e.nota || "", val, ver, at:e.data || undefined});
    if (ok === false) break; n++;
  }
  toast(`${n} ${n === 1 ? "linha importada" : "linhas importadas"}${nd ? `, ${pl(nd, "decisão", "decisões")}` : ""}${skip ? `, ${skip} ignoradas` : ""}.`);
}

document.addEventListener("keydown", e => {

    const ae = document.activeElement, inQ = ae === $("q") || ae === $("tq");

      const rows = [...document.querySelectorAll("[data-trow]")], i = rows.indexOf(ae), id = ae.dataset.trow, ix = TREE.ix;
      const mv = j => { const el = rows[Math.max(0, Math.min(rows.length - 1, j))]; if (el) { el.focus(); el.scrollIntoView({block:"nearest"}); } };
      if (e.key === "ArrowDown") { e.preventDefault(); mv(i + 1); return; }
      if (e.key === "ArrowUp") { e.preventDefault(); mv(i - 1); return; }
      if (e.key === "Home") { e.preventDefault(); mv(0); return; }
      if (e.key === "End") { e.preventDefault(); mv(rows.length - 1); return; }
      if (e.key === "ArrowRight") { e.preventDefault(); if (ix.kids[id] && !TREE.open.has(id)) { TREE.open.add(id); renderTreeList(); document.querySelector(`[data-trow="${CSS.escape(id)}"]`)?.focus(); } else mv(i + 1); return; }
