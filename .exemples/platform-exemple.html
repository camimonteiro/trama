<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Foundations / Lumen 2.0 → 3.0 · Equivalência de tokens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--side:#f6f8fa;--ink:#18212b;--ink2:#3d4853;--mu:#6a7581;--line:#e4e8ec;--line2:#d3d9df;--stage:#e6ebf2;--card:#ffffff;
  --ac:#006fff;--ok:#1d7f46;--warn:#9a6412;--low:#c2342f;--chk:#eef1f4;--zeb:#f8fafb;--sel:#eef4ff;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d;--side:#171d24;--ink:#e8ecf0;--ink2:#c3cad2;--mu:#8d98a4;--line:#262e37;--line2:#323c47;--stage:#0a0e13;--card:#232c37;
  --ac:#6aa6ff;--ok:#52c285;--warn:#e0a84a;--low:#f07a72;--chk:#1f262e;--zeb:#161c23;--sel:#18273d;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d;--side:#171d24;--ink:#e8ecf0;--ink2:#c3cad2;--mu:#8d98a4;--line:#262e37;--line2:#323c47;--stage:#0a0e13;--card:#232c37;
  --ac:#6aa6ff;--ok:#52c285;--warn:#e0a84a;--low:#f07a72;--chk:#1f262e;--zeb:#161c23;--sel:#18273d;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
code,.mono{font-family:var(--mono);font-size:12.5px}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn{border:1px solid var(--line2);background:var(--bg);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--mu)}
.btn[disabled]{opacity:.5;cursor:default}
.link{border:0;background:none;padding:0;color:var(--ac);cursor:pointer;text-decoration:underline;text-underline-offset:2px}

.app{display:grid;grid-template-columns:284px minmax(0,1fr);min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column}
.side-top{padding:24px 18px 16px;border-bottom:1px solid var(--line)}
.brand b{display:block;font-weight:600;font-size:15px}
.brand span{color:var(--mu);font-size:13px}
.prog{margin-top:16px}
.prog-row{display:grid;grid-template-columns:64px 1fr 38px;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);margin-top:6px}
.prog-row .pct{text-align:right;font-variant-numeric:tabular-nums}
.bar-t{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar-t i{display:block;height:100%;background:var(--ac)}
.bar-t.ap i{background:var(--ok)}
.prog-mode{font-size:12px;color:var(--mu);margin:10px 0 0}
.prog-act{display:flex;gap:6px;margin-top:10px}
.prog-act .btn{font-size:12px;padding:4px 8px;white-space:nowrap;flex:1}
.side-nav{overflow:auto;padding:12px 10px 20px;flex:1}
.nav-h{display:grid;grid-template-columns:1fr 58px 54px;gap:4px;font-size:11.5px;color:var(--mu);padding:10px 10px 4px}
.nav-h span:not(:first-child){text-align:right}
.nav{list-style:none;margin:0;padding:0}
.nav button{width:100%;display:grid;grid-template-columns:1fr 58px 54px;gap:4px;align-items:baseline;border:0;background:none;padding:6px 10px;border-radius:6px;cursor:pointer;text-align:left;color:var(--ink2)}
.nav button.simple{grid-template-columns:1fr auto}
.nav button:hover{background:var(--chk)}
.nav button[aria-current="true"]{background:var(--bg);color:var(--ink);font-weight:500;box-shadow:inset 0 0 0 1px var(--line)}
.nav .p{font-size:12px;color:var(--mu);text-align:right;font-variant-numeric:tabular-nums;font-weight:400}
.navsep{height:1px;background:var(--line);margin:10px}
.side-foot{padding:12px 18px;border-top:1px solid var(--line)}
.side-foot .btn{font-size:12px;padding:4px 8px}

main{min-width:0}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 32px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 240px;position:relative;max-width:380px}
.search input{width:100%;background:var(--side);border:1px solid var(--line);border-radius:8px;padding:7px 12px 7px 34px}
.search input:focus{outline:none;border-color:var(--ac);background:var(--bg)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mu)}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:11px var(--sans);color:var(--mu);border:1px solid var(--line2);border-radius:4px;padding:0 5px}
.search input:not(:placeholder-shown)+kbd,.search input:focus+kbd{display:none}
.seg{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px;flex:1 1 100%;min-width:0}
.fgrp{display:flex;flex-direction:column;gap:4px;min-width:0}
.fgrp .fl{font-size:11px;line-height:1;color:var(--mu);padding-left:2px;letter-spacing:.02em}
.fbox{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--bg);transition:border-color .15s}
.fbox:has(button[aria-pressed="true"]){border-color:var(--ink)}
.fbox button{border:0;background:var(--bg);margin:0;padding:6px 12px;cursor:pointer;color:var(--ink2);font-size:13px;line-height:1.3;white-space:nowrap;display:inline-flex;align-items:baseline;gap:6px;transition:background-color .15s,color .15s}
.fbox button+button{border-left:1px solid var(--line2)}
.fbox:has(button[aria-pressed="true"]) button+button{border-left-color:var(--line2)}
.fbox button:hover{background:var(--chk);color:var(--ink)}
.fbox button:focus-visible{outline:2px solid var(--ac);outline-offset:-2px}
.fbox button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:500}
.fbox button[aria-pressed="true"]:hover{background:var(--ink);color:var(--bg)}
.fbox .n{font-variant-numeric:tabular-nums;font-size:12px;color:var(--mu)}
.fbox button[aria-pressed="true"] .n{color:inherit;opacity:.7}
.fbox button.z .t{color:var(--mu)}
@media (prefers-reduced-motion:reduce){.fbox,.fbox button{transition:none}}
.fdesc{border-left:2px solid var(--ac);padding:2px 0 2px 14px;margin:0 0 22px;max-width:80ch;color:var(--ink2);font-size:13.5px}
.fdesc b{color:var(--ink);font-weight:600}
.fdesc .meta{display:block;margin-top:4px;font-size:12.5px;color:var(--mu)}
.mprog{display:none;font-size:12px;color:var(--mu)}

.content{padding:34px 32px 96px;max-width:1320px}
.content.enter{animation:enter .22s cubic-bezier(.2,.7,.2,1)}
.content.leave{opacity:0;transform:translateY(-6px);transition:opacity .1s ease-out,transform .1s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.content.enter{animation:none}.content.leave{transition:none;opacity:1;transform:none}}
h1{font-size:26px;font-weight:600;letter-spacing:-.015em;margin:0 0 6px}
h2{font-size:16px;font-weight:600;margin:0 0 6px}
h3{font-size:14px;font-weight:600;margin:0 0 4px}
.desc{color:var(--ink2);max-width:70ch;margin:0 0 24px}
.desc code{background:var(--chk);padding:1px 4px;border-radius:4px}
.notice{border-left:2px solid var(--warn);padding:2px 0 2px 14px;margin:0 0 24px;max-width:78ch;color:var(--ink2)}
.notice b{color:var(--ink);font-weight:600}
.filterline{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin:-8px 0 20px;color:var(--ink2)}
section.block{margin-top:40px}
section.block:first-of-type{margin-top:0}
.why{color:var(--ink2);max-width:70ch;margin:0 0 12px}
.guide{max-width:78ch;margin:0 0 16px;padding:0;list-style:none}
.guide li{padding:8px 0;border-top:1px solid var(--line)}
.guide li:last-child{border-bottom:1px solid var(--line)}
.guide b{font-weight:600}
.guide .c{color:var(--mu);font-size:12.5px;margin-left:6px}
details.fold>summary{cursor:pointer;color:var(--ac);margin:4px 0 12px}

/* overview */
.ov-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);border-radius:10px;margin-bottom:36px}
.ov-meta div{padding:14px 16px;border-left:1px solid var(--line)}
.ov-meta div:first-child{border-left:0}
.ov-meta dt{font-size:12px;color:var(--mu)}
.ov-meta dd{margin:2px 0 0;font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
.how{max-width:70ch;color:var(--ink2);margin:0 0 32px;padding-left:18px}
.how li{margin:5px 0}
.tw{overflow-x:auto}
@media (min-width:901px){
  .tw.stk{overflow:visible}
  .tw.stk>table{min-width:0 !important}
  .tw.stk thead th{position:sticky;top:var(--barh,56px);z-index:3;background:var(--bg);border-bottom:0;box-shadow:inset 0 -1px 0 var(--line2);padding-top:10px}
  .tw.stk .map thead th:nth-child(even){background:var(--zeb)}
  .tw.stk thead th.stuck-shadow{box-shadow:inset 0 -1px 0 var(--line2),0 6px 8px -8px rgba(0,0,0,.25)}
}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-weight:500;font-size:12px;color:var(--mu);padding:0 14px 8px 10px;border-bottom:1px solid var(--line2);vertical-align:bottom}
th small{display:block;font-weight:400;opacity:.85}
td{padding:10px 14px 10px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.num{text-align:right;font-variant-numeric:tabular-nums}
.ov tr.go{cursor:pointer}
.ov tr.go:hover td{background:var(--side)}
.ov td:first-child{font-weight:500}
.cat{table-layout:fixed;min-width:720px;margin-bottom:36px}
.cat col.k1{width:19%}.cat col.k2{width:22%}.cat col.k3,.cat col.k4{width:11%}.cat col.k5{width:23%}.cat col.k6{width:3%}
.cat thead tr.gh th{border-bottom:0;padding-bottom:2px;color:var(--ink2);font-size:12px;font-weight:600}
.cat thead tr.gh th.gl{border-bottom:1px solid var(--line2)}
.cat thead tr.gh th+th{padding-left:18px}
.cat td{padding-top:14px;padding-bottom:14px}
.cat td.sep,.cat th.sep{border-left:1px solid var(--line);padding-left:18px}
.cat .nm{display:block;font-weight:500;color:var(--ink)}
.cat .sub{display:block;font-size:12px;color:var(--mu);font-weight:400;font-variant-numeric:tabular-nums}
.cat .meter{display:flex;align-items:center;gap:10px}
.cat .meter .bar-t{flex:1;max-width:140px;height:6px;border-radius:3px}
.cat .meter b{font-weight:500;font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.cat .meter small{color:var(--mu);font-size:12px;white-space:nowrap}
.cat .n2{font-variant-numeric:tabular-nums}
.cat .val2{display:grid;grid-template-columns:62px 1fr 36px;align-items:center;gap:4px 8px;font-size:12px;color:var(--mu)}
.cat .val2 .bar-t{height:4px}
.cat .val2 .pct{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
.cat .chev{color:var(--mu);text-align:right}
.cat tr.go:hover .chev{color:var(--ac)}
.cat tr.tot td{border-top:1px solid var(--ink);border-bottom:0;font-weight:600}
.cat tr.tot .nm{font-weight:600}
.zero{color:var(--mu)}

/* mapping table */
.map{table-layout:fixed;min-width:1060px}
.map col.c1{width:22%}.map col.c2{width:22%}.map col.c3{width:15%}.map col.c4{width:20%}.map col.c5{width:8%}.map col.c6{width:13%}
.tok3{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.tok3 small{font-size:11.5px;color:var(--mu)}
.tok3 small code{font-size:11px}
.stw{display:block;font-size:11px;color:var(--mu);margin:2px 0 0 22px}
.cands{list-style:none;margin:0 0 4px;padding:0}
.cands li{padding:3px 0;line-height:1.4}
.cands li .sw{width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.cands li .mu{display:block;font-size:12px;margin-left:20px}
.map col:nth-child(even){background:var(--zeb)}
.map tbody tr.r{cursor:pointer}
.map tbody tr.r:hover td{background:color-mix(in srgb,var(--side) 70%,transparent)}
.map tbody tr.r.sel td{background:var(--sel)}
.map tbody tr.r.sel td:first-child{box-shadow:inset 3px 0 0 var(--ac)}
.map tbody tr.r.sel+tr.det td{background:var(--sel);box-shadow:inset 3px 0 0 var(--ac)}
.grp td{padding:22px 10px 6px;border-bottom:1px solid var(--line2);font-size:12px;color:var(--mu);font-weight:500;background:var(--bg)}
.grp .gc{font-variant-numeric:tabular-nums;margin-left:6px;font-weight:400}
.secgrp td{padding-top:30px;font-size:14px;color:var(--ink);font-weight:600}
.tok{display:flex;align-items:center;gap:6px;min-width:0}
.tok code,.ell{overflow-wrap:break-word;min-width:0}
.copy{border:0;background:none;padding:2px;cursor:pointer;color:var(--mu);opacity:0;flex:none;border-radius:4px;line-height:0}
tr.r:hover .copy,tr.r.sel .copy,.copy:focus-visible{opacity:1}
.v{display:flex;align-items:center;gap:8px;min-width:0}
.v .hx{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.v .hx small{font:11.5px var(--sans);color:var(--mu)}
.v .pre{color:var(--mu);flex:none}
.ac{color:var(--ac)}
.v code.ac{font-weight:500}
.same{color:var(--mu);font-size:13px}
.sws{display:inline-flex;gap:2px;flex:none}
.sw{display:inline-block;width:22px;height:26px;border-radius:5px;position:relative;overflow:hidden;flex:none;
  background-image:linear-gradient(45deg,var(--chk) 25%,transparent 25%,transparent 75%,var(--chk) 75%),linear-gradient(45deg,var(--chk) 25%,transparent 25%,transparent 75%,var(--chk) 75%);background-size:8px 8px;background-position:0 0,4px 4px}
.sw i{position:absolute;inset:0}
.sw::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(127,140,155,.4)}
.sws .sw:first-child{border-radius:5px 0 0 5px}.sws .sw:last-child{border-radius:0 5px 5px 0}.sws .sw:only-child{border-radius:5px}
.rad{display:inline-block;width:18px;height:18px;border:1.5px solid var(--ink2);border-left:0;border-bottom:0;flex:none}
.o{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.o span{font-size:13px}
.o small{font-size:11.5px;color:var(--mu);overflow-wrap:break-word}
.o small code{font-size:11.5px}
.none{color:var(--mu);font-style:italic;font-size:13px}
.cf{font-size:12px;white-space:nowrap}
.cf.c2{color:var(--mu)}.cf.c1{color:var(--warn)}.cf.c0{color:var(--low);font-weight:500}
.cf::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}
.cf.c2::before{background:transparent;box-shadow:inset 0 0 0 1px currentColor}
.st{font-size:12.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.st.pendente{color:var(--mu)}
.st.revisado{color:var(--ac);font-weight:500}.st.aplicado{color:var(--ok);font-weight:500}
.mk{flex:none;width:16px;height:16px;display:inline-block;line-height:0}
.mk svg{width:16px;height:16px;display:block}
.mk.pendente{color:var(--line2)}
.mk.revisado{color:var(--ac)}
.mk.aplicado{color:var(--ok)}
.mk.stale{color:var(--warn)}
.st.stale{color:var(--warn);font-weight:500}
.ver{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:0 0 36px}
.ver-h{display:flex;gap:10px 24px;flex-wrap:wrap;align-items:baseline;margin:0 0 6px}
.ver-h h2{margin:0}
.ver-h span{font-size:13px;color:var(--ink2)}
.ver-h span b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.ver p{margin:0 0 10px;font-size:13.5px;color:var(--ink2);max-width:80ch}
.ver p:last-child{margin-bottom:0}
.ver .diffs{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:13px;margin:0 0 10px;padding:0;list-style:none}
.ver .diffs li b{font-weight:600;font-variant-numeric:tabular-nums}
.ver .diffs li small{color:var(--mu)}
.ver .acts{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
.ver.alert{border-color:var(--warn);border-left-width:3px}
.ov-meta dd.warn{color:var(--warn)}
.wf{list-style:none;margin:18px 0 0;padding:0;position:relative;max-width:980px}
.wf-step{display:grid;grid-template-columns:44px 1fr;gap:18px;position:relative;padding-bottom:22px}
.wf-step:not(:last-child)::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--line2)}
.wf-n{width:44px;height:44px;border-radius:50%;background:var(--ac);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;position:relative;z-index:1}
.wf-c{border:1px solid var(--line2);border-radius:14px;padding:18px 22px;background:var(--bg)}
.wf-c h3{font-size:16px;margin:0 0 8px}
.wf-c p{margin:0 0 10px;font-size:13.5px;line-height:1.55;color:var(--ink2);max-width:72ch}
.wf-who{font-size:13px!important;color:var(--mu)!important}
.wf-who b{color:var(--ink2);font-weight:600;margin-right:6px}
.wf-nums{display:flex;flex-wrap:wrap;gap:10px 28px;margin:4px 0 12px}
.wf-nums dt{font-size:12px;color:var(--mu)}
.wf-nums dd{margin:2px 0 0;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.wf-nums dd.warn{color:var(--warn)}
.wf-act{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.wf-act .btn.mplay{margin-top:0}
.wf-todo .wf-n{background:var(--bg);color:var(--mu);box-shadow:inset 0 0 0 2px var(--line2)}
.wf-todo .wf-c{border-style:dashed;background:transparent}
@media (max-width:900px){.wf-step{grid-template-columns:34px 1fr;gap:12px}.wf-n{width:34px;height:34px;font-size:14px}.wf-step:not(:last-child)::before{left:16px;top:34px}.wf-c{padding:14px 16px}}
.fcov .fbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);margin:10px 0 10px;max-width:900px}
.fseg{display:block;height:100%}
.fs-semantico{background:var(--ac)}.fs-composicao{background:color-mix(in srgb,var(--ac) 55%,var(--bg))}.fs-tom{background:#7c5cff}.fs-ajuste{background:var(--warn)}.fs-legado{background:color-mix(in srgb,var(--mu) 55%,var(--bg))}.fs-aposentar{background:repeating-linear-gradient(45deg,var(--line2) 0 4px,transparent 4px 8px)}
.flg{list-style:none;display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 10px;padding:0;font-size:13px}
.flg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.ajt td,.ajt th{font-size:12.5px}
.tok .mk{margin-right:2px}
.map tbody tr.r.aplicado td:first-child code{color:var(--ink2)}
.vlegend{display:inline-flex;gap:12px;align-items:center}
.vlegend span{display:inline-flex;gap:5px;align-items:center}
.det td{padding:2px 14px 18px 10px}
.det .in{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,1fr);gap:24px}
.det dl{display:grid;grid-template-columns:132px 1fr;gap:5px 14px;font-size:13px;color:var(--ink2);margin:0}
.det dl{align-content:start}
.det dl .dsec{grid-column:1/-1;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);margin:10px 0 2px;padding-top:8px;border-top:1px solid var(--line)}
.fcl{display:block;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;margin-bottom:2px}
dd .fcl{display:inline}
.fc-semantico{color:var(--ac)}.fc-tom{color:#7c5cff}.fc-ajuste{color:var(--warn)}.fc-composicao{color:var(--ink2)}.fc-legado{color:var(--mu)}.fc-aposentar{color:var(--mu);text-decoration:line-through}
.fdep{color:var(--warn)!important}
.det dt{color:var(--mu)}.det dd{margin:0}
.det .sw{width:16px;height:16px;vertical-align:-3px;margin-right:4px;border-radius:4px}
.val-box h3{font-size:13px;margin-bottom:10px}
.val-box p{margin:0 0 10px;font-size:13px;color:var(--ink2)}
.vstep{list-style:none;margin:0 0 12px;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.vstep li{position:relative;display:flex;gap:8px;align-items:flex-start;padding-right:10px;font-size:12.5px;color:var(--mu);line-height:1.3}
.vstep li+li::before{content:"";position:absolute;left:-10px;top:8px;width:6px;height:1px;background:var(--line2)}
.vstep li b{display:block;font-weight:500;color:var(--ink2)}
.vstep li.done b{color:var(--ink)}
.vstep li.now b{color:var(--ink);font-weight:600}
.vstep li .mk{margin-top:0}
.vstep li.next .mk{color:var(--mu)}
.vstep li.done .mk{color:var(--mu)}
.vstep li.now .mk.pendente{color:var(--ink2)}
.btn.primary.ok .mk svg path{stroke:var(--ok)}
.vmeta{font-size:12.5px;color:var(--mu);margin:0 0 12px}
.vhint{font-size:13px;color:var(--ink2);border-left:2px solid var(--line2);padding:1px 0 1px 10px;margin:0 0 14px}
.vhint.warn{border-left-color:var(--warn)}
.vnext{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin:0 0 14px}
.vnext .cap{font-size:12.5px;color:var(--mu);margin:0}
.vnext .alt{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;margin-top:2px}
.vnext .done-msg{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ok);font-weight:500}
.btn.primary{background:var(--ac);border-color:var(--ac);color:var(--bg);font-weight:500;padding:7px 14px;display:inline-flex;align-items:center;gap:8px}
.btn.primary:hover{filter:brightness(1.08);border-color:var(--ac)}
.btn.primary.ok{background:var(--ok);border-color:var(--ok)}
.btn.primary .mk{color:var(--bg)}
.btn.primary .mk svg circle{stroke:currentColor}
.val-box label.nl{display:block;font-size:12.5px;color:var(--mu);margin:0 0 4px}
.val-steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.val-box textarea{width:100%;min-height:56px;resize:vertical;border:1px solid var(--line2);border-radius:6px;background:var(--bg);padding:6px 8px;font-size:13px}
.val-box .row{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:12px;color:var(--mu)}
.empty{padding:40px 0;color:var(--ink2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ramps */
.ramp{margin:0 0 26px}
.ramp-h{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.ramp-h h3{margin:0;font-family:var(--mono);font-size:13.5px;font-weight:500}
.ramp-h span{color:var(--ink2);font-size:13px}
.ramp-h .mu{color:var(--mu)}
.strip{display:grid;grid-template-columns:132px repeat(var(--n),minmax(0,1fr));align-items:stretch;gap:2px}
.strip+.strip{margin-top:2px}
.strip .lab{font-size:12px;color:var(--mu);align-self:center}
.strip .cell{height:34px;position:relative;
  background-image:linear-gradient(45deg,var(--chk) 25%,transparent 25%,transparent 75%,var(--chk) 75%),linear-gradient(45deg,var(--chk) 25%,transparent 25%,transparent 75%,var(--chk) 75%);background-size:8px 8px;background-position:0 0,4px 4px}
.strip .cell i{position:absolute;inset:0}
.strip .cell:nth-child(2){border-radius:6px 0 0 6px}.strip .cell:last-child{border-radius:0 6px 6px 0}
.strip.steps .s{font:11px var(--mono);color:var(--mu);text-align:center;padding-top:3px}
.strip.steps .s.ch{color:var(--ac)}
.strip .cell.empty{background:repeating-linear-gradient(45deg,var(--chk) 0 4px,transparent 4px 8px);box-shadow:inset 0 0 0 1px var(--line)}
.strip.ref .cell{opacity:.92}
.ramp .why-m{font-size:12.5px;color:var(--mu);margin:6px 0 0 134px;max-width:70ch}

/* typography sample */
.tsample{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;margin:0 0 32px}
.tsample>div{padding:18px 20px}
.tsample>div+div{border-left:1px solid var(--line)}
.tsample h3{font-size:12px;color:var(--mu);font-weight:500;margin:0 0 12px}
.tsample .sp{margin:0 0 14px}
.tsample .sp:last-child{margin:0}
.tsample .fam{font-size:12px;color:var(--mu);margin:0 0 4px}
.tsample .big{font-size:32px;line-height:38.4px;font-weight:500;margin:0}
.tsample .body{font-size:16px;line-height:22.4px;margin:0;max-width:44ch}
.fwarn{font-size:12px;color:var(--warn);margin:6px 0 0}

/* decisions */
.dec{border-top:1px solid var(--ink);padding:18px 0 8px;margin:0 0 40px}
.dec .q{color:var(--ink2);max-width:74ch;margin:0 0 18px}
.opts{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.opts>div{padding:14px 16px}
.opts>div+div{border-left:1px solid var(--line)}
.opts .k{font-size:12px;color:var(--mu);margin:0 0 4px}
.opts h3{font-size:13.5px;margin:0 0 10px}
.opts .now h3{color:var(--mu);font-weight:500}
.opts p{margin:10px 0 0;font-size:13px;color:var(--ink2)}
.chips{display:flex;gap:2px;flex-wrap:wrap}
.chips .sw{width:30px;height:30px;border-radius:0}
.chips .sw:first-child{border-radius:6px 0 0 6px}.chips .sw:last-child{border-radius:0 6px 6px 0}
.nos{font-size:13px;color:var(--mu);font-style:italic;height:30px;display:flex;align-items:center}
.dec-meta{display:grid;grid-template-columns:150px 1fr;gap:6px 16px;margin:16px 0 0;font-size:13.5px;max-width:860px}
.dec-meta dt{color:var(--mu)}.dec-meta dd{margin:0}
.opts>div.chosen{box-shadow:inset 0 3px 0 var(--ac);background:color-mix(in srgb,var(--ac) 6%,var(--bg))}
.opts .pick{margin-top:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.opts .picked{display:inline-flex;gap:6px;align-items:center;color:var(--ac);font-weight:600;font-size:12.5px}
.dec-state{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px;font-size:13.5px}
.dec-state b{font-weight:600}
.dec-state.pend{color:var(--warn)}
.dconf{display:inline-flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--ink);font-weight:500}
.dconf .btn{font-weight:500}
.dec-state.done{color:var(--ink2)}
.dec-state.done b{color:var(--ink)}
.dnote{width:100%;max-width:520px;min-height:48px;border:1px solid var(--line2);border-radius:6px;background:var(--bg);padding:6px 8px;font-size:13px;resize:vertical}
.tok3 .dch{font-size:11.5px;color:var(--mu);line-height:1.35;margin-top:2px}
.tok3 .dch b{font-weight:500;color:var(--ink2)}
.tok3 .dch.pend b{color:var(--warn)}
.cmps{grid-column:1/-1;border-top:1px solid var(--line2);padding-top:14px}
.cmp{margin-top:12px}
.cmp+.cmp{margin-top:14px}
.cmp h4{font-size:13px;font-weight:600;margin:0 0 2px}
.cmp .cs{font-size:12.5px;color:var(--mu);margin:0 0 8px}
.cmp .cs b{color:var(--ink2);font-weight:500}
.cmp .cs.pend b{color:var(--warn)}
.cmp-grid{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.cmp-grid>div{padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cmp-grid>div+div{border-left:1px solid var(--line)}
.cmp-grid>div.chosen{box-shadow:inset 0 3px 0 var(--ac)}
.cmp-grid .k{font-size:11.5px;color:var(--mu);line-height:1.3}
.cmp-grid .on{font-size:12.5px;font-weight:500;line-height:1.3;color:var(--ink)}
.cmp-grid .vv{display:flex;align-items:center;gap:8px;min-width:0}
.cmp-grid .vv .sw{width:30px;height:30px;border-radius:6px}
.cmp-grid .rep{font-size:11.5px;color:var(--mu)}
.cmp-grid .dt{font-size:12px;color:var(--ink2);line-height:1.35}
.cmp-grid .pk{font-size:12px}
@media (max-width:900px){.cmp-grid{grid-template-columns:1fr}.cmp-grid>div+div{border-left:0;border-top:1px solid var(--line)}}

/* só no 3.0 & motion */
.only td{vertical-align:top}
.only .shape{display:inline-block;width:40px;height:22px;border:1.5px solid var(--ink2)}
.only .inset{display:inline-block;border:1px dashed var(--mu);border-radius:4px}
.only .inset i{display:block;width:16px;height:10px;background:var(--line2);border-radius:2px}
.plain td{vertical-align:top}

/* árvores */
.side-tree{margin:0 0 10px}
.side-tree .nav-h{grid-template-columns:1fr;padding:0 0 4px;display:block}
.side-tree .nav{margin:0 -8px}
.tr-top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px;margin:0 0 12px}
.tr-chk{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--ink2);padding:6px 2px;cursor:pointer}
.tr-chk input{accent-color:var(--ink);width:15px;height:15px}
body.tree-mode .bar{display:none}
.tr-wrap{display:flex;flex-direction:column;gap:12px}
.tr-top .tr-sp{flex:1}
.tr-q{position:relative;display:inline-flex;align-items:center}
.tr-q svg{position:absolute;left:10px;color:var(--mu)}
.tr-q input{width:180px;background:var(--side);border:1px solid var(--line);border-radius:8px;padding:6px 10px 6px 30px;font-size:13px}
.tr-q input:focus{outline:none;border-color:var(--ac);background:var(--bg)}
.tr-full{display:inline-flex;align-items:center;gap:7px;padding:7px 9px;line-height:1}
.tr-stage{position:relative;height:clamp(440px, calc(100vh - 290px), 900px);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.tr-stage.is-list{height:clamp(440px, calc(100vh - 290px), 900px);overflow:hidden}
.tr-wrap.is-full,.tr-wrap:fullscreen{position:fixed;inset:0;z-index:60;background:var(--bg);padding:calc(14px + env(safe-area-inset-top,0px)) 20px calc(14px + env(safe-area-inset-bottom,0px));gap:12px;width:100%;height:100%}
.tr-wrap:fullscreen{position:static}
.tr-wrap.is-full .tr-stage,.tr-wrap:fullscreen .tr-stage{flex:1;height:auto;min-height:0}
.tr-wrap.is-full .tr-top,.tr-wrap:fullscreen .tr-top{margin:0}
body.tr-noscroll{overflow:hidden}
/* lista */
.tr-list{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.tr-list[hidden]{display:none}
.tl-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12.5px}
.tl-act{display:flex;gap:14px}
.tl-head,.tl-row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(110px,.6fr) minmax(0,1.1fr) 120px;align-items:center;column-gap:16px}
.tl-head{padding:8px 16px;font-size:11.5px;color:var(--mu);border-bottom:1px solid var(--line2);background:var(--side)}
.tl-body{flex:1;overflow:auto;padding:4px 0 24px}
.tl-row{padding:0 16px;min-height:34px;cursor:pointer;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);position:relative}
.tl-row:hover{background:color-mix(in srgb,var(--side) 80%,transparent)}
.tl-row:focus-visible{outline:2px solid var(--ac);outline-offset:-2px}
.tl-row.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--ac)}
.tl-row.hit .nm{background:color-mix(in srgb,var(--warn) 22%,transparent);border-radius:3px;padding:0 3px;margin:0 -3px}
.tl-row.dim .nm,.tl-row.dim .c-val,.tl-row.dim .c-rel{opacity:.5}
.tl-row.l0{min-height:42px}
.tl-row.l0 .nm{font-weight:600;font-size:14.5px}
.tl-row.l1{min-height:40px;background:color-mix(in srgb,var(--side) 60%,transparent)}
.tl-row.l1 .nm{font-weight:600}
.tl-row.l2 .nm{font-weight:500}
.c-name{display:flex;align-items:center;min-width:0;height:100%;align-self:stretch}
.c-name .gd{flex:none;width:18px;align-self:stretch;position:relative}
.c-name .gd::before{content:"";position:absolute;left:8px;top:0;bottom:0;border-left:1px solid var(--line2)}
.c-name .gd:last-of-type::after{content:"";position:absolute;left:8px;top:50%;width:9px;border-top:1px solid var(--line2)}
.c-name .gd.end:last-of-type::before{bottom:50%}
.tw-t,.tw-sp{flex:none;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;margin-right:2px}
.tw-t{border:0;background:none;padding:0;border-radius:4px;cursor:pointer;color:var(--mu)}
.tw-t:hover{background:var(--chk);color:var(--ink)}
.tw-t svg{transition:transform .12s}
.tl-row[aria-expanded="true"] > .c-name .tw-t svg{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){.tw-t svg{transition:none}}
.c-name .dot{flex:none;width:8px;height:8px;border-radius:50%;margin:0 8px 0 2px;box-shadow:inset 0 0 0 1px rgba(127,140,155,.35)}
.c-name .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.c-name .nm.mono{font-family:var(--mono);font-size:12.5px}
.c-name .cnt{flex:none;margin-left:8px;font-size:11.5px;color:var(--mu);font-variant-numeric:tabular-nums}
.c-name .full{display:none}
.c-val{min-width:0;overflow:hidden}
.c-val .lv{display:inline-flex;align-items:center;gap:5px;max-width:100%}
.c-val .lv code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.c-val .sw{width:18px;height:18px;border-radius:4px}
.c-val code{font-size:11.5px;color:var(--ink2)}
.c-val .ar{color:var(--mu);font-size:12px}
.c-rel{min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-rel .rel{display:inline-flex;align-items:center;gap:6px;max-width:100%}
.c-rel .rel .link,.c-rel code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.rk{flex:none;width:14px;height:2px;border-radius:1px;background:var(--ac)}
.rk-merge{background:#7c5cff}.rk-split{background:#e0782f}.rk-alias{background:var(--ok)}
.c-st .st{font-size:12px}
#tGraph{position:absolute;inset:0}
.tr-status{position:absolute;left:14px;top:12px;font-size:12.5px;color:var(--mu);z-index:2;pointer-events:auto}
.tr-stage.is-list .tr-status{position:static;padding:0}
.tr-legend{position:absolute;left:12px;bottom:12px;z-index:2;background:color-mix(in srgb,var(--bg) 90%,transparent);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 12px;max-width:min(640px,calc(100% - 24px))}
.tr-legend[hidden]{display:none}
.tr-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.tr-legend .lk b{display:inline-block;width:14px;height:2px;margin-right:5px;vertical-align:3px}
.tr-panel[hidden]{display:none}
.tr-panel{position:absolute;top:12px;right:12px;z-index:3;width:320px;max-height:calc(100% - 24px);overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:0 10px 28px -14px rgba(0,0,0,.35);font-size:13px}
.tp-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin:0 0 10px}
.tp-k{display:block;font-size:11.5px;color:var(--mu)}
.tp-n{display:block;font-size:13px;font-weight:500;overflow-wrap:anywhere}
.tr-panel dl{display:grid;grid-template-columns:96px 1fr;gap:5px 10px;margin:0}
.tr-panel dt{color:var(--mu)}.tr-panel dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tr-panel .vv{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tr-panel .vv .sw{width:16px;height:16px;border-radius:4px}
.tr-panel .vv small{color:var(--mu)}
.tp-act{margin-top:12px}
.tp-list{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
.tp-list li{padding:5px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.mu{color:var(--mu)}
.tr-list{padding:14px 18px}
.tl,.tl ul{list-style:none;margin:0;padding:0}
.tl ul{padding-left:18px;border-left:1px solid var(--line);margin-left:6px}
.tl li{padding:2px 0;font-size:13px}
.tl summary{cursor:pointer}
.tr-hint{font-size:12.5px;color:var(--mu);margin:8px 0 4px}
.tr-src{font-size:12.5px;color:var(--ink2);margin:0 0 14px}
.tr-pre{background:var(--side);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font:12px/1.5 var(--mono);overflow-x:auto;margin:0}
@media (max-width:900px){
  .tl-head{display:none}
  .tl-row{grid-template-columns:minmax(0,1fr) auto;row-gap:2px;padding:6px 12px}
  .tl-row .c-rel{grid-column:1;padding-left:28px;font-size:12px}
  .tl-row .c-st{grid-column:2;grid-row:1;justify-self:end}
  .tl-row .c-val{grid-column:2;grid-row:2;justify-self:end}
  .tr-q input{width:100%}
  .tr-q{flex:1 1 100%}
  .tr-top .tr-sp{display:none}
  .tw:has(table.ov),.tw:has(table.only),.tw:has(table.plain){overflow-x:auto}
  aside .side-foot{display:block;border-top:0;padding:0 6px 10px}
  aside .side-foot #theme{display:none}
  .side-tree{margin:0}
  .side-tree .nav-h{display:none}
  .side-tree .nav{display:flex;margin:0;gap:4px}
  .tr-stage{height:min(70vh,560px)}
  .tr-panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:55%}
  .tr-legend{display:none}
}
/* movimento */
.msim{margin:4px 0 6px}
.dec-sec{margin:36px 0 6px;font-size:18px}
.mgrid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.mgrid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.mp{border:1px solid var(--line2);border-radius:14px;padding:20px 22px}
.mp h3{margin:0 0 10px;font-size:15px}.mp p{margin:0 0 10px;font-size:13.5px;line-height:1.55;color:var(--ink2)}.mp p:last-child{margin-bottom:0}.mp p.mu{color:var(--mu)}
.mcard,.mtr{border:1px solid var(--line2);border-radius:14px;padding:22px 24px 24px;background:var(--bg);min-width:0;display:flex;flex-direction:column}
.mcard > .btn.mplay{align-self:flex-start}
.mtr.flash,.mcard.flash,.mdur.flash{animation:mflash 1.2s ease-out}
@keyframes mflash{0%{box-shadow:0 0 0 3px var(--ac)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.mtr.flash,.mcard.flash,.mdur.flash{animation:none;box-shadow:0 0 0 2px var(--ac)}}
.mch{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 18px;flex-wrap:wrap}
.mch code{font-size:13px;font-weight:500}
.mcard p{font-size:13.5px;line-height:1.55;margin:0 0 10px;color:var(--ink2)}.mcard p:last-child{margin-bottom:0}.mcard p.mu{color:var(--mu)}
.mcard .mstage{margin-top:8px}
.mact{display:flex;align-items:center;gap:14px;margin:18px 0 16px}
.btn.mplay{display:inline-flex;align-items:center;gap:8px;margin-top:20px;background:var(--ac);border:1px solid var(--ac);color:var(--bg);font-weight:600;font-size:13.5px;padding:9px 20px 9px 16px;border-radius:999px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn.mplay:hover{filter:brightness(1.08);border-color:var(--ac)}
.btn.mplay:active{transform:translateY(1px)}
.btn.mplay[disabled]{opacity:1;cursor:default;background:color-mix(in srgb,var(--ac) 55%,var(--bg));border-color:transparent}
.mact .btn.mplay{margin-top:0}


/* árvore do 3.0 */
.m3-top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 18px;margin:18px 0 8px}
.m3-ctl{display:flex;flex-direction:column;gap:5px}
.m3-l{font-size:11px;color:var(--mu)}

  --ac:#5c9dff;--ac-ink:#8bb8ff;--ac-soft:color-mix(in srgb,#5c9dff 14%,transparent);--ok:#58c98d;--warn:#e8b25a;--low:#f2837b;

  --shadow-1:0 1px 2px rgba(0,0,0,.35);--shadow-2:0 1px 2px rgba(0,0,0,.35),0 8px 20px -10px rgba(0,0,0,.6)}

/* texto e links com contraste AA */
a,.link{color:var(--ac-ink)}
.link{text-decoration-thickness:1px;text-underline-offset:3px;transition:color .15s}
.link:hover{color:var(--ink)}
code.ac,.v code.ac,.ac{color:var(--ac-ink)}
.st.revisado,.fc-semantico,.picked{color:var(--ac-ink)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:4px}

/* hierarquia */
h1{font-size:30px;letter-spacing:-.02em;margin-bottom:10px}
h2{font-size:17px;letter-spacing:-.005em}
.desc{color:var(--ink2);line-height:1.6}
section.block{margin-top:48px}
section.block > h2{padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:12px}

/* barra lateral */
aside{background:var(--side);border-right:1px solid var(--line2)}
.side-top{border-bottom:1px solid var(--line2)}
.brand b{font-size:16px;letter-spacing:-.01em}
.prog .bar-t{height:6px;border-radius:3px;background:var(--line2)}
.nav button{border-radius:8px;padding:7px 10px;transition:background-color .15s,color .15s}
.nav button:hover{background:color-mix(in srgb,var(--ink) 5%,transparent);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--bg);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--ac),var(--shadow-1)}
.nav-h{font-weight:600;color:var(--mu)}
.side-foot{border-top:1px solid var(--line2)}

/* barra de busca e filtros */
.bar{background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line2);box-shadow:0 6px 16px -14px rgba(15,23,32,.35)}
.search input{background:var(--side);border-color:var(--line2);border-radius:10px}
.search input:focus{box-shadow:0 0 0 3px var(--ac-soft)}
.fgrp .fl{text-transform:uppercase;letter-spacing:.05em;font-size:10.5px;font-weight:600}
.fbox{border-color:var(--line2);border-radius:10px;box-shadow:var(--shadow-1)}
@media (min-width:901px){.fbox button{padding:7px 13px}}
@media (max-width:900px){
  .fbox:has(button:nth-child(4)){grid-auto-flow:row;grid-template-columns:repeat(3,minmax(0,1fr))}
  .fbox:has(button:nth-child(4)) button:nth-child(3n+1){border-left:0}
  .fbox:has(button:nth-child(4)) button:nth-child(n+4){border-top:1px solid var(--line2)}
}
.fbox button:hover{background:color-mix(in srgb,var(--ac) 7%,var(--bg))}

/* blocos e cartões: uma só linguagem */
.ver,.mp,.mcard,.mtr,.wf-c,.tr-panel{box-shadow:var(--shadow-2);border-color:var(--line2)}
.ver{border-radius:16px;padding:20px 24px;background:var(--bg)}
.ver.alert{border-left-width:4px}
.ov-meta{border:0;gap:12px;background:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}
.ov-meta div{border:1px solid var(--line2)!important;border-radius:14px;background:var(--bg);box-shadow:var(--shadow-1);padding:14px 16px;min-width:0}
.ov-meta dt{text-transform:uppercase;letter-spacing:.04em;font-size:10.5px;font-weight:600}
.ov-meta dd{font-size:28px;font-weight:650;letter-spacing:-.01em;line-height:1;margin:0;font-variant-numeric:tabular-nums}
.ov-meta div{display:flex;flex-direction:column-reverse;justify-content:space-between;gap:12px}
.ov-meta dt{line-height:1.35}
.notice{background:color-mix(in srgb,var(--warn) 9%,transparent);border-left:3px solid var(--warn);border-radius:0 10px 10px 0;padding:12px 16px}
.fdesc{background:var(--ac-soft);border-left:3px solid var(--ac);border-radius:0 10px 10px 0;padding:12px 16px}
.dec{border-top:0;border:1px solid var(--line2);border-radius:16px;padding:22px 24px 18px;box-shadow:var(--shadow-2);margin-bottom:28px;background:var(--bg)}
.dec-sec{margin:44px 0 6px;font-size:20px}
.opts{border-color:var(--line2);border-radius:12px}
.opts>div.chosen{box-shadow:inset 0 3px 0 var(--ac);background:var(--ac-soft)}
.dec-state{padding:10px 14px;border-radius:10px;background:var(--side)}
.dec-state.pend{background:color-mix(in srgb,var(--warn) 9%,transparent)}

/* tabelas */
th{font-size:12px;font-weight:600;color:var(--mu)}
th small{font-weight:400}
.map tbody tr.r td{transition:background-color .12s}
.map tbody tr.r:hover td{background:color-mix(in srgb,var(--ac) 5%,var(--bg))}
.map tbody tr.r.sel td{background:var(--sel)}
.grp td{color:var(--ink2);font-size:12px;font-weight:600;letter-spacing:.02em;border-bottom:1px solid var(--line2)}
.grp .gc{color:var(--mu)}
.secgrp td{font-size:16px;color:var(--ink);padding-top:34px;letter-spacing:-.005em}
.det td{background:color-mix(in srgb,var(--sel) 60%,var(--bg))}
.tok code{color:var(--ink);font-weight:500}
.cf.c0{color:var(--low)}.cf.c1{color:var(--warn)}
.st.aplicado{color:var(--ok)}.st.stale{color:var(--warn)}
.sw::after{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 18%,transparent)}

/* tabela "Por categoria" */
.cat tr.go td{transition:background-color .12s}
.cat tr.go:hover td{background:color-mix(in srgb,var(--ac) 5%,var(--bg))}
.cat .meter .bar-t,.cat .val2 .bar-t{background:var(--line)}

/* cobertura do Facelift */
.fcov .fbar{height:14px;border-radius:7px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 8%,transparent)}

/* botões */
.btn{border-color:var(--line2);transition:border-color .15s,background-color .15s,box-shadow .15s}
.btn:hover{border-color:var(--mu);background:var(--side)}
.btn.primary,.btn.mplay{box-shadow:0 1px 2px rgba(15,23,32,.12),0 4px 10px -6px color-mix(in srgb,var(--ac) 70%,transparent)}
.btn.primary:hover,.btn.mplay:hover{filter:none;background:color-mix(in srgb,var(--ac) 88%,#000);border-color:transparent}

/* fluxo de trabalho */
.wf-n{box-shadow:0 0 0 5px var(--bg),0 2px 6px -2px color-mix(in srgb,var(--ac) 60%,transparent)}
.wf-step:not(:last-child)::before{background:linear-gradient(var(--ac),var(--line2) 60%)}
.wf-todo .wf-n{box-shadow:inset 0 0 0 2px var(--line2),0 0 0 5px var(--bg)}

/* árvore e motion */
.tr-stage,.mstage{border-color:var(--line2)}
.mstage{box-shadow:inset 0 1px 3px rgba(15,23,32,.1)}

@media (prefers-reduced-motion:reduce){.link,.nav button,.btn,.map tbody tr.r td,.cat tr.go td{transition:none}}

/* sem tarjas laterais: destaque por fundo e contorno, nunca por faixa de cor na borda */
.nav button[aria-current="true"]{box-shadow:var(--shadow-1),inset 0 0 0 1px var(--line2)}
.map tbody tr.r.sel td:first-child,.map tbody tr.r.sel+tr.det td,.tl-row.sel{box-shadow:none}
.ver.alert{border-width:1px;border-color:color-mix(in srgb,var(--warn) 55%,var(--line2))}
.notice,.fdesc{border-left:0;border-radius:10px}
.vhint{border-left:0;padding:9px 12px;border-radius:8px;background:var(--side)}
.vhint.warn{background:color-mix(in srgb,var(--warn) 9%,transparent)}
.opts>div.chosen,.cmp-grid>div.chosen{box-shadow:inset 0 0 0 1.5px var(--ac)}

/* ================= filtro em painel + visão geral enxuta ================= */
.bar{flex-wrap:wrap;gap:10px;padding:12px 32px;align-items:center}
.search{flex:0 1 380px;max-width:380px;min-width:220px}
.seg{flex:0 0 auto;display:block;min-width:0}
.fl{display:flex;align-items:center;gap:6px}
.fl-btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:1px solid var(--line2);border-radius:999px;background:var(--bg);color:var(--ink);font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;box-shadow:var(--shadow-1);transition:border-color .15s,background-color .15s}
.fl-btn:hover{border-color:var(--mu);background:var(--side)}
.fl-btn .n{font-size:12px;font-variant-numeric:tabular-nums;opacity:.75}
.fl-btn .chev{transition:transform .15s;opacity:.7}
.fl-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.fl-btn.on,.fl-btn.on:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.fl-x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:var(--bg);color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:var(--shadow-1)}
.fl-x:hover{border-color:var(--mu);background:var(--side);color:var(--ink)}
.fl-pop{position:absolute;left:32px;top:calc(100% + 8px);z-index:30;width:min(780px,calc(100% - 64px));max-height:min(72vh,580px);overflow:auto;background:var(--bg);border:1px solid var(--line2);border-radius:16px;box-shadow:0 20px 44px -18px rgba(15,23,32,.4),var(--shadow-2);padding:16px 18px 6px}
.fl-pop[hidden]{display:none}
.fl-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.fl-h>span{font-size:13px;font-weight:600;color:var(--ink)}
.fl-all{display:inline-flex;gap:8px;align-items:baseline;border:1px solid var(--line2);border-radius:999px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;padding:5px 14px;cursor:pointer}
.fl-all b{font-weight:500;font-variant-numeric:tabular-nums;color:var(--mu)}
.fl-all:hover{background:var(--side)}
.fl-all[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.fl-all[aria-pressed="true"] b{color:inherit;opacity:.75}
.fl-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 24px;align-items:start}
.fl-g:first-child{grid-row:span 2}
.fl-g{break-inside:avoid;margin:0 0 16px}
.fl-g h3{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mu);margin:0 0 6px;padding:0 10px}
.fl-o{display:flex;width:100%;align-items:baseline;justify-content:space-between;gap:10px;padding:7px 10px;margin:0 0 2px;border:0;border-radius:8px;background:transparent;color:var(--ink);font:inherit;font-size:13.5px;text-align:left;cursor:pointer;transition:background-color .12s}
.fl-o:hover{background:var(--side)}
.fl-o[aria-pressed="true"]{background:var(--ac-soft);color:var(--ac-ink);font-weight:600;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 40%,transparent)}
.fl-o .n{font-size:12px;font-variant-numeric:tabular-nums;color:var(--mu);font-weight:400}
.fl-o.z .t{color:var(--mu)}
.fl-btn:focus-visible,.fl-o:focus-visible,.fl-all:focus-visible,.fl-x:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* visão geral */
.ov-hero{display:flex;justify-content:space-between;align-items:flex-start;gap:14px 32px;flex-wrap:wrap}
.ov-hero h1{margin:0}
.lede{margin:8px 0 0;color:var(--ink2);font-size:15px;line-height:1.55;max-width:60ch}
.ov-cta{display:flex;gap:10px;flex-wrap:wrap;padding-top:4px}
.ov-cta .btn b{font-weight:600;font-variant-numeric:tabular-nums;margin-left:4px}
.rules{display:grid;grid-template-columns:1fr 1fr;margin-top:22px;border:1px solid var(--line2);border-radius:14px;background:var(--bg);box-shadow:var(--shadow-1);overflow:hidden}
.rules>div{display:flex;flex-direction:column;gap:3px;padding:13px 18px;font-size:13.5px;color:var(--ink2)}
.rules>div+div{border-left:1px solid var(--line2)}
.rules b{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;color:var(--mu)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.kpi{display:flex;flex-direction:column;gap:8px;text-align:left;padding:14px 16px;border:1px solid var(--line2);border-radius:14px;background:var(--bg);box-shadow:var(--shadow-1);font:inherit;color:inherit;min-width:0}
.kpi b{font-size:28px;line-height:1;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;line-height:1.35;color:var(--mu)}
.kpi.warn b{color:var(--warn)}
button.kpi{cursor:pointer;transition:border-color .15s,box-shadow .15s}
button.kpi:hover{border-color:var(--ac);box-shadow:var(--shadow-2)}
.ov-sec{margin-top:34px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:6px 16px;flex-wrap:wrap;margin:0 0 12px}
.sec-h h2{margin:0}
.sec-h span{font-size:13px;color:var(--mu)}
.card-tbl{border:1px solid var(--line2);border-radius:14px;background:var(--bg);box-shadow:var(--shadow-1)}
.card-tbl table{margin:0}
.ov-2col{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;margin-top:34px;align-items:start}
.ovc{border:1px solid var(--line2);border-radius:16px;padding:18px 20px 16px;background:var(--bg);box-shadow:var(--shadow-2);min-width:0}
.ovc.alert{border-color:color-mix(in srgb,var(--warn) 55%,var(--line2))}
.ovc-h{display:flex;align-items:baseline;justify-content:space-between;gap:4px 14px;flex-wrap:wrap;margin:0 0 14px}
.ovc-h h2{font-size:16px;margin:0}
.ovc-meta{font-size:12.5px;color:var(--mu)}
.ovc-meta b{font-weight:600;color:var(--ink)}
.ovc-stats{display:flex;gap:10px 30px;flex-wrap:wrap;margin:0 0 14px}
.ovc-stats b{display:block;font-size:26px;line-height:1;font-weight:650;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.ovc-stats span{display:block;margin-top:6px;font-size:12.5px;color:var(--mu)}
.ovc-line{margin:12px 0 0;font-size:13.5px;line-height:1.55;color:var(--ink2)}
.ovc .acts{margin-top:10px}
.ovc .fbar{margin:0 0 10px;max-width:none}
.ovc .flg{margin:0}
.more{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.more>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ink2)}
.more>summary::-webkit-details-marker{display:none}
.more>summary::before{content:"›";display:inline-block;width:10px;color:var(--mu);transition:transform .15s}
.more[open]>summary::before{transform:rotate(90deg)}
.more>summary:hover{color:var(--ink)}
.more p{margin:10px 0 0;font-size:13px;line-height:1.55;color:var(--ink2);max-width:70ch}
.more ul.how{margin:6px 0 0;padding-left:18px;font-size:13px}
.more ul.how li{margin:3px 0}
.more .diffs{margin:6px 0 0}
.guide{max-width:none;width:auto;margin-top:30px;border:1px solid var(--line2);border-radius:14px;padding:14px 18px;background:var(--bg)}
.guide>summary{font-size:15px;font-weight:600;color:var(--ink)}
.gloss{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 36px;margin:10px 0 0}
.gloss>div{display:grid;grid-template-columns:132px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.gloss dt{font-weight:600;color:var(--ink)}
.gloss dd{margin:0;color:var(--ink2);line-height:1.5}
.src{margin:22px 0 0;font-size:12px;color:var(--mu);line-height:1.6}
@media (max-width:1180px){.ov-2col{grid-template-columns:1fr}}
@media (max-width:900px){
  .bar{position:relative}
  .search{flex:1 1 100%;max-width:none}
  .seg{flex:1 1 100%}
  .fl-btn{flex:1 1 auto;justify-content:center}
  .fl-pop{left:16px;right:16px;width:auto}
  .fl-cols{grid-template-columns:1fr}

aside.sb .nav button:hover:not([aria-current="true"]){background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink)}
aside.sb .nav button:active:not([aria-current="true"]){background:color-mix(in srgb,var(--ink) 11%,transparent)}

aside.sb .nav button:focus-visible,aside.sb .nav-tg:focus-visible,aside.sb #theme:focus-visible{outline:2px solid var(--ac);outline-offset:-2px}

.rules.scope{grid-template-columns:repeat(3,1fr);margin-top:12px}

<body>
<div class="app">
  <aside class="sb">
    <div class="side-top">
      <div class="brand"><b>Lumen 2.0 → 3.0</b><span>Equivalência de tokens</span></div>

:"motion.duration.slow","saida":"motion.duration.base","nota":"Entrada slow, saída base."}],"reduzido":{"regra":"Com \"reduzir movimento\" ativo, o movimento desliga e toda mudança é instantânea: toda transição dura motion.duration.instant, e nada fica em ciclo.","excecoes":["O tempo mínimo de leitura da sequência de status continua.","Carregamento e sucesso ficam parados, com texto e ícone visíveis."]},"semToken":[{"padrao":"Eco do que se digita","motivo":"O caractere aparece na hora; quem dá o ritmo é a pessoa."},{"padrao":"Movimento do sistema","motivo":"Teclado do sistema, inércia de rolagem e gesto de voltar nativo seguem o tempo do sistema."}],"gatilhos":{"vocabulario":[{"id":"ativar","nome":"Ativar","descricao":"A pessoa ativa um elemento: toque completo, Enter ou Espaço no teclado, ou o leitor de tela (gatilho activate, decisão 0060).","eventos":["activate"]},{"id":"estado","nome":"Estado","descricao":"O estado do próprio Component muda: pressionado, ligado, selecionado (gatilhos press-start, press-end, value-change e selection-change).","eventos":["press-start","press-end","hover-change","focus-change","value-change","selection-change","disabled-change"]},{"id":"aparecer","nome":"Aparecer","descricao":"O elemento ou a tela aparece.","eventos":["appear"]},{"id":"dado","nome":"Dado","descricao":"Um dado chega ou muda: valor carregado, placeholder trocado, texto substituído.","eventos":["value-change"]},{"id":"gesto-do-sistema","nome":"Gesto do sistema","descricao":"Gesto que o sistema operacional controla, como voltar. Segue o tempo do sistema e não usa token.","eventos":[]},{"id":"gesto","nome":"Gesto","descricao":"Gesto sobre o próprio elemento, como arrastar o sheet para baixo.","eventos":[]},{"id":"tempo","nome":"Tempo","descricao":"O tempo passa: ciclo contínuo ou tempo mínimo de leitura.","eventos":[]},{"id":"scroll","nome":"Rolagem","descricao":"A rolagem é gatilho, não nome (decisão 0062). dispara: a transição que já existe toca uma vez quando o alvo cruza o início. acompanha: transition.<padrão>.progress segue a rolagem, de 0 a 1.","eventos":["appear"]}],"quem":[{"id":"componente","descricao":"O próprio Component, no contrato dele."},{"id":"chassis","descricao":"O Chassis, que junta as telas e as formas (Navigation Schema)."},{"id":"asset","descricao":"O asset de marca, como o gradiente do carregamento."},{"id":"produto","descricao":"A área de produto que usa a transição, como no roteiro da sequência de status."}],"scroll":{"definido":false,"nota":"A forma está decidida (decisão 0062): a rolagem é gatilho, não nome. Nenhuma animação de rolagem concreta está definida ainda. O produto tem rolagem, e a aparição de valores e o odômetro podem ser conduzidos por ela; só a inércia de rolagem é do sistema (§13) e não vira token.","campos":[{"campo":"alvo","formato":"texto","descricao":"O elemento que a rolagem observa (trigger).","uso":"usado"},{"campo":"inicio","formato":"{ do, na, deslocamento? }","descricao":"Onde a animação começa: do = topo, centro ou base do alvo; na = topo, centro ou base da tela; deslocamento opcional, com fonte (start).","uso":"usado","nota":"No dispara, é onde toca."},{"campo":"fim","formato":"{ do, na, deslocamento? }","descricao":"Onde a animação termina, no mesmo formato de inicio (end).","uso":"usado","nota":"Só no acompanha."},{"campo":"acompanha","formato":"booleano","descricao":"Se a animação acompanha a rolagem quadro a quadro (scrub).","uso":"fora-do-modelo","nota":"Substituído por modo: acompanha = true, dispara = false."},{"campo":"suavizacaoMs","formato":"número, com fonte","descricao":"O atraso com que a animação alcança a rolagem, em ms (scrub numérico).","uso":"fora-do-modelo","nota":"Sem fonte; entra se o acompanha precisar de suavização."},{"campo":"fixa","formato":"booleano","descricao":"Se o alvo fica fixo na tela entre inicio e fim (pin).","uso":"fora-do-modelo","nota":"Fixar é layout, não movimento: entra no contrato do Chassis (cabeçalho fixo), não na transição."},{"campo":"acoes","formato":"{ aoEntrar, aoSair, aoEntrarDeNovo, aoVoltar }","descricao":"O que a animação faz em cada passagem (toggleActions).","uso":"fora-do-modelo","nota":"Substituído por modo e aoInverter: dispara = aoEntrar tocar; acompanha = reverte ao voltar."},{"campo":"umaVez","formato":"booleano","descricao":"Se toca uma vez só (once).","uso":"fora-do-modelo","nota":"Implícito no dispara."},{"campo":"eixo","formato":"x | y","descricao":"O eixo da rolagem.","uso":"usado","nota":"Entra em gatilho.scroll.eixo: y na rolagem da tela, x num carrossel."},{"campo":"interpola","formato":"[{ propriedade, de, para, unidade, curva?, status }]","descricao":"O que a rolagem interpola: opacidade, escala, posicao, forma, valor.","uso":"usado","nota":"Só no acompanha."}],"modelo":{"status":"definido","registro":"0062","descricao":"A rolagem conduz uma interpolação de progresso, de 0 a 1, entre o início e o fim do intervalo.","modos":[{"id":"acompanha","descricao":"O progresso segue a rolagem, quadro a quadro, e é reversível: rolar de volta desfaz."},{"id":"dispara","descricao":"Toca uma vez ao cruzar o início, com a duração e a curva de tokens (motion.duration.*, motion.easing.*)."}],"intervalo":"inicio e fim, no formato de campos: { do: topo | centro | base (do alvo), na: topo | centro | base (da tela), deslocamento? }.","interpola":{"formato":"[{ propriedade, de, para, unidade, curva?, status }]","propriedades":["opacidade","escala","posicao","forma","valor"],"unidades":{"opacidade":"de 0 a 1","escala":"fator (1 = tamanho natural)","posicao":"token de distância (motion.distance.*) ou porcentagem do próprio elemento","forma":"token de raio (shape.*)","valor":"número ou o odômetro"},"nota":"Só no modo acompanha; no dispara, a transição que já existe define o que anima. valor é um número ou o odômetro. Propriedade sem primitivo na Foundation (escala, forma) leva definidoPor."},"aoInverter":["reverte","nada"],"reduzido":"Com \"reduzir movimento\", o estado final aparece sem interpolar.","perguntas":["Com acompanha, o stagger dos dígitos do odômetro distribui o progresso entre os dígitos?"],"mapa":{"dispara":{"acompanha":false,"umaVez":true,"acoes":{"aoEntrar":"tocar"},"usa":["alvo","inicio","eixo"]},"acompanha":{"acompanha":true,"usa":["alvo","inicio","fim","eixo","interpola"],"aoInverter":"reverte (rolar de volta desfaz)"}},"nivel":"conduzido: a transição de modo acompanha não tem duração; o progresso vem da rolagem. Não entra em motion.niveis."},"semantica":{"status":"definido","registro":"0062","descricao":"A rolagem é gatilho (gatilho.tipo: scroll), não nome. Modo dispara: usa a transição que já existe, com um gatilho de rolagem a mais (o valor que aparece continua transition.reveal.enter). Modo acompanha: usa o momento progress, transition.<padrão>.progress, com gatilho { tipo: \"scroll\", scroll: { modo, intervalo, interpola } }. A squad escolhe pelo nome, como nas outras transições.","conflito":"Resolvido pela decisão 0062: transition.scroll.<nome> punha o gatilho no nome e não cabia na convenção. progress entrou na lista de momentos.","emAberto":"No DTCG, todo token transition exige duração; num token progress, quem conduz é a rolagem. Resolver com a Engenharia ao criar o primeiro token progress."},"exemplos":[{"id":"titulo-encolhe","nome":"Título que encolhe","token":"transition.header.progress","ilustrativo":true,"padrao":"navegacao","nivel":"conduzido","uso":"Título grande da tela que encolhe até o cabeçalho conforme a pessoa rola.","exemplo":"Extrato: o título \"Extrato\" encolhe e sobe para a barra ao rolar a lista.","reduzido":"O título passa ao tamanho do cabeçalho ao cruzar o início, sem interpolar.","gatilho":{"tipo":"scroll","status":"proposto","scroll":{"modo":"acompanha","eixo":"y","intervalo":{"inicio":{"do":"topo","na":"topo"},"fim":{"do":"base","na":"topo"}},"interpola":[{"propriedade":"escala","de":1,"para":0.7,"unidade":"fator","status":"proposto"},{"propriedade":"posicao","de":0,"para":"{motion.distance.short}","unidade":"token de distância, para cima","status":"proposto"}]}}},{"id":"itens-aparecem","nome":"Itens que aparecem","token":"transition.content.enter","ilustrativo":true,"gatilho":{"tipo":"scroll","status":"proposto","scroll":{"modo":"dispara","intervalo":{"inicio":{"do":"topo","na":"base"}}}},"nota":"Modo dispara: a transição que já existe, com gatilho de rolagem. Nenhum token novo."},{"id":"valor-aparece","nome":"Valor que aparece e roda com o odômetro","token":"transition.reveal.enter","transicoes":["transition.reveal.enter","transition.odometer.change"],"ilustrativo":true,"gatilho":{"tipo":"scroll","status":"proposto","scroll":{"modo":"dispara","intervalo":{"inicio":{"do":"topo","na":"base"}}}},"nota":"Modo dispara: o valor aparece com transition.reveal.enter e roda com transition.odometer.change. A escala fica de fora: nenhuma transição de valor tem escala hoje; se for desejada, é uma transição nova."},{"id":"forma-muda","nome":"Forma que muda","token":"transition.card.progress","ilustrativo":true,"padrao":"superficie","nivel":"conduzido","uso":"Cartão que perde o arredondamento e vira faixa quando encosta no topo da tela.","exemplo":"Home: o cartão de saldo vira uma faixa fixa ao rolar.","reduzido":"O cartão passa à forma final ao cruzar o início, sem interpolar.","gatilho":{"tipo":"scroll","status":"proposto","scroll":{"modo":"acompanha","eixo":"y","intervalo":{"inicio":{"do":"topo","na":"topo"},"fim":{"do":"base","na":"topo"}},"interpola":[{"propriedade":"forma","de":"{shape.xl}","para":"{shape.xs}","unidade":"token de raio","status":"proposto"}]}}}]},"reduzido":"Reduzir movimento não dispara animação: troca o contexto, e toda transição passa a durar zero. Os gatilhos disparam do mesmo jeito (decisão 0060)."},"decisoes":[{"id":"saida-de-veu-e-conteudo","titulo":"Saída do véu e do conteúdo","pergunta":"A entrega define a entrada do véu e do conteúdo, mas não a saída. Quando um sheet ou diálogo fecha, o véu some com que transição?","quem":"Julio Ferracini","atividade":"Decisão de Design no protótipo de motion","opcoes":[{"nome":"Criar transition.backdrop.exit e transition.content.exit","detalhe":"Saída mais curta que a entrada, com a curva de saída."},{"nome":"O véu e o conteúdo somem com a superfície","detalhe":"Sem token próprio: usam a saída do sheet ou do diálogo."}],"tokens":["transition.backdrop.enter","transition.content.enter","transition.sheet.exit","transition.modal.exit"],"decidido":{"opcao":1,"por":"Julio Ferracini","data":"2026-11-03","registro":"0057","nota":"O véu e o conteúdo saem na transição de saída do sheet ou do diálogo."}},{"id":"exemplos-faltando","titulo":"Exemplo de uso faltando","pergunta":"O guia de uso da entrega não dá exemplo real para cinco transições. Quais telas do app mostram cada uma?","quem":"Frente de Movimento, com as squads","atividade":"Levantar um exemplo real por transição","opcoes":[{"nome":"Levantar exemplos nas telas do redesign","detalhe":"Um exemplo por transição, no mesmo formato do guia."},{"nome":"Deixar sem exemplo","detalhe":"O painel mostra só o uso."}],"tokens":["transition.selection.change","transition.sheet.exit","transition.backdrop.enter","transition.loading.enter","transition.success.loop"]},{"id":"veu-junto-da-superficie","titulo":"Véu junto da superfície","pergunta":"O véu entra junto com o sheet e com o diálogo? A entrega diz que ele fica atrás deles, mas não diz o tempo; o véu dura menos (base) que a entrada do sheet e do diálogo (slow).","quem":"Julio Ferracini","atividade":"Confirmar no protótipo de motion","opcoes":[{"nome":"Junto, começando no mesmo instante","detalhe":"O véu termina antes da superfície."},{"nome":"O véu antes, a superfície depois","detalhe":"Sequência, como na troca de tela."}],"tokens":["transition.backdrop.enter","transition.sheet.enter","transition.modal.enter"],"decidido":{"opcao":0,"por":"Julio Ferracini","data":"2026-11-03","registro":"0057","nota":"O véu começa com a superfície e termina antes dela."}},{"id":"saida-da-navegacao","titulo":"Saída na navegação entre telas","pergunta":"A entrega diz que a saída é sempre mais curta que a entrada, mas push.exit e pop.exit duram 250 ms, igual à entrada. Qual vale?","quem":"Julio Ferracini","atividade":"Decisão de Design no protótipo de motion","opcoes":[{"nome":"Encurtar as saídas de navegação para fast","detalhe":"push.exit e pop.exit passam a 150 ms."},{"nome":"Manter 250 ms e limitar a regra","detalhe":"A regra vale só para sheet e diálogo, porque na navegação as duas telas deslizam juntas."}],"tokens":["transition.push.enter","transition.push.exit","transition.pop.enter","transition.pop.exit"],"decidido":{"opcao":1,"por":"Julio Ferracini","data":"2026-11-03","registro":"0057","nota":"push.exit e pop.exit ficam com 250 ms; a regra da saída mais curta vale para sheet e diálogo."},"atualizacao":{"registro":"0061","nota":"Entrada slow e saída base: a saída da navegação passa a ser mais curta que a entrada, como em sheet, diálogo e Takeover. A regra da saída mais curta vale para todas as formas.","por":"Julio Ferracini","data":"2026-11-03"}},{"id":"curva-do-veu","titulo":"Curva do véu","pergunta":"A regra manda usar a curva enter na chegada, mas backdrop.enter usa move. Qual vale?","quem":"Julio Ferracini","atividade":"Decisão de Design no protótipo de motion","opcoes":[{"nome":"Manter move","detalhe":"Registrar que fade no lugar usa move."},{"nome":"Passar para enter","detalhe":"O véu segue a regra de chegada."}],"tokens":["transition.backdrop.enter","motion.easing.enter","motion.easing.move"],"decidido":{"opcao":0,"por":"Julio Ferracini","data":"2026-11-03","registro":"0057","nota":"Fade no lugar usa move."}},{"id":"magnitudes-nao-definidas","titulo":"Valores que a entrega não define","pergunta":"Seis transições não diziam toda a composição (hoje o dono do que falta aparece em definidoPor): a opacidade do esmaecer em press, selection, modal.enter e success.enter; o eixo e a distância do deslize no toggle; o eixo, a distância e a opacidade em loading.loop. Quem define?","quem":"Julio Ferracini","atividade":"Completar a entrega ou registrar como não definido","opcoes":[{"nome":"Definir no delivery, por token","detalhe":"Cada valor que falta entra na transição."},{"nome":"Deixar a cargo do componente","detalhe":"Fica registrado como não definido na Foundation."},{"nome":"Misto: valores definidos na Foundation; toggle com o componente e loading com o asset","detalhe":"Opacidade de press, selection, modal.enter e success.enter na Foundation; o curso do toggle e o movimento do loading em definedBy."}],"tokens":["transition.press.change","transition.selection.change","transition.toggle.change","transition.loading.loop","transition.success.enter","transition.modal.enter"],"decidido":{"opcao":0,"por":"Julio Ferracini","data":"2026-11-03","registro":"0057","nota":"Definidos na Foundation, não na entrega: opacidade de press, selection, modal.enter e success.enter. O curso do toggle é do Component e o movimento do loading é do asset, em definedBy."}},{"id":"direcao-do-slide","titulo":"Sentido do slide com distância","pergunta":"A distância diz quanto o elemento anda, mas não para onde. Para onde vão success.enter e success.loop?","quem":"Julio Ferracini","atividade":"Decisão de Design","opcoes":[{"nome":"Chave direction no token","detalhe":"up, down, left ou right ao lado de distance; as duas transições de sucesso sobem."},{"nome":"Distância com sinal","detalhe":"O sentido sai do sinal do número."}],"tokens":["transition.success.enter","transition.success.loop","motion.distance.short","motion.distance.subtle"],"decidido":{"opcao":0,"por":"Julio Ferracini","data":"2026-11-03","registro":"0057","nota":"direction: up nas duas transições de sucesso."}},{"id":"ciclo-do-loop","titulo":"Formato do ciclo com distância","pergunta":"No success.loop, 8 é a amplitude total ou ±8 em torno do centro? Como o ciclo começa, e a duração é a ida ou a ida e a volta?","quem":"Julio Ferracini","atividade":"Decisão de Design","opcoes":[{"nome":"Amplitude total, parte do lugar, duração de ida e volta","detalhe":"Parado no lugar, sobe 8 px e volta em 1500 ms."},{"nome":"Como o protótipo da entrega","detalhe":"1500 ms em cada sentido, ciclo de 3000 ms."}],"tokens":["transition.success.loop","motion.duration.loop","motion.distance.subtle"],"decidido":{"opcao":0,"por":"Julio Ferracini","data":"2026-11-03","registro":"0057","nota":"Amplitude total de 8 px; parte parado do lugar, sobe e volta; 1500 ms é a ida e a volta."}},{"id":"sentido-do-odometro","titulo":"Sentido do odômetro","pergunta":"Os dígitos sobem ou descem, e isso muda quando o valor aumenta ou diminui?","quem":"Julio Ferracini","atividade":"Decisão de Design","opcoes":[{"nome":"Segue o valor","detalhe":"Aumenta: os dígitos que mudam sobem, passando pelos do meio, inclusive de 9 para 0. Diminui: descem."},{"nome":"Pela posição do dígito","detalhe":"Cada dígito vai direto ao novo, pela posição de 0 a 9, como no protótipo da entrega."}],"tokens":["transition.odometer.change"],"decidido":{"opcao":0,"por":"Julio Ferracini","data":"2026-11-03","registro":"0057","nota":"direction: with-value."}},{"id":"duracao-da-navegacao","titulo":"Duração da navegação entre telas","pergunta":"Na validação do protótipo, a Page em 250 ms ficou rápida demais, ao abrir e ao voltar. Qual duração?","quem":"Julio Ferracini","atividade":"Validação do protótipo do Navigation Schema","opcoes":[{"nome":"slow, 350 ms","detalhe":"A duração do sheet e do Takeover."},{"nome":"expressive, 600 ms","detalhe":"A duração dos momentos de marca, como exceção registrada."},{"nome":"Manter base, 250 ms","detalhe":"Como na entrega."}],"tokens":["transition.push.enter","transition.push.exit","transition.pop.enter","transition.pop.exit","motion.duration.expressive"],"decidido":{"opcao":1,"por":"Julio Ferracini","data":"2026-11-03","registro":"0059","nota":"push.* e pop.* em motion.duration.expressive; as curvas não mudam."},"atualizacao":{"registro":"0061","nota":"push.enter e pop.enter em slow (350 ms); push.exit e pop.exit em base (250 ms). Substitui os 600 ms da 0059.","por":"Julio Ferracini","data":"2026-11-03"}},{"id":"gatilhos-de-scroll","titulo":"Animações ligadas à rolagem","pergunta":"Animações ligadas à rolagem: o que fazer? Nenhuma fonte define animação ligada à rolagem (título que encolhe, cabeçalho fixo, parallax), mas o produto já tem rolagem, como a Home.","quem":"Julio Ferracini","atividade":"Decisão de Design","opcoes":[{"nome":"Não usar animação ligada à rolagem no Redesign por enquanto","detalhe":"A rolagem só rola; nada anima por ela."},{"nome":"Definir por transição","detalhe":"Cada animação de rolagem diz alvo, início, fim, se acompanha, se fixa e as ações."},{"nome":"Definir por token semântico","detalhe":"A squad escolhe pelo nome; a rolagem fica no gatilho. dispara: a transição que já existe; acompanha: transition.<padrão>.progress (decisão 0062)."}],"tokens":[],"decidido":{"opcao":2,"por":"Julio Ferracini","data":"2026-11-03","registro":"0062","nota":"Por token semântico, com a rolagem como gatilho: dispara usa a transição que existe; acompanha usa transition.<padrão>.progress."}},{"id":"gatilhos-propostos","titulo":"Gatilhos propostos","pergunta":"Três transições não tinham gatilho na fonte e receberam uma proposta: o diálogo abre e fecha pelo activate, e a sequência de status avança pela etapa do processo, que é do produto. Valem?","quem":"Julio Ferracini","atividade":"Decisão de Design","opcoes":[{"nome":"Aceitar as propostas","detalhe":"O status passa de proposto a definido, com o registro da decisão."},{"nome":"Definir de outro jeito","detalhe":"Editar o gatilho de cada transição antes de mudar o status."}],"recomendacao":"Aceitar as propostas. O diálogo abrir e fechar pelo activate segue a regra da 0060 (o significado vem de activate), como as outras formas; a sequência de status avançar pela etapa do processo é o que a entrega diz no §8.3 (é do produto). Recomendação, não escolha.","tokens":["transition.modal.enter","trans
